name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint — syntax errors and undefined names
        run: |
          flake8 models/ preprocessing/ evaluation/ deployment/ scripts/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — warnings (non-blocking)
        run: |
          flake8 models/ preprocessing/ evaluation/ scripts/ \
            --count --exit-zero --max-line-length=120 --statistics

      - name: Verify core imports
        run: |
          python -c "
          from models.classification.classifier_model import ChipTestClassifier
          from models.anomaly_detection.vae_model import VariationalAutoEncoder
          from models.statistical.sigma_rules import SigmaRule
          from models.ensemble import HybridEnsemble
          from preprocessing.preprocessing import FeatureScaler
          from evaluation.metrics import TestTimeEvaluator
          print('All core imports OK')
          "

      - name: Run prediction on synthetic data
        run: |
          python scripts/predict.py -n 50 || echo "Prediction requires trained model artifacts"
